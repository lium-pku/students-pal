<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线 — 学伴</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f0;
      color: #1a2e25;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .container {
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: #2a9d8f;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 44px;
      height: 44px;
      stroke: white;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #1a2e25;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #5a6b62;
      margin-bottom: 1.5rem;
    }
    .hint {
      font-size: 0.85rem;
      color: #8a9b92;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e0e5e0;
    }
    button {
      background: #2a9d8f;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover, button:active {
      background: #21887c;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1>当前处于离线状态</h1>
    <p>学伴需要网络连接才能访问 AI 功能和学习数据。请检查网络后重试。</p>
    <button onclick="window.location.reload()">重新连接</button>
    <div class="hint">
      提示:已缓存的知识点和笔记内容在离线时仍可查看。
    </div>
  </div>
  <script>
    // 监听网络恢复
    window.addEventListener('online', () => {
      window.location.reload()
    })
  </script>
</body>
</html>
